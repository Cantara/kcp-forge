[package]
name = "kcp-forge"
version = "0.4.1"
edition = "2024"
description = "Forge loose skill files into governed KCP units — and keep the whole corpus sound. Corpus-level validate/convert/drift/wire/health for the Knowledge Context Protocol."
license = "Apache-2.0"
repository = "https://github.com/Cantara/kcp-forge"
keywords = ["kcp", "knowledge", "agents", "governance", "validation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
boon = "0.6.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
strip = true
